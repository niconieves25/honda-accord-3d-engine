/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* Honda F22 Engine Explorer — large, high-contrast, keyboard-first. --scale is the text size (1 = 18 px). */
:root {
  --scale: 1.25;
  --lscale: 1.25;
  --fs: calc(18px * var(--scale));
  --bg: #000;
  --panel: #111214;
  --fg: #fff;
  --dim: #d6d6d6;
  --line: #5a5d63;
  --accent: #ffd400;
  --accent-ink: #000;
  --focus: #ffd400;
  --btn: #1d1f23;
  --btn-on: #ffd400;
  --btn-on-ink: #000;
  --label-bg: rgba(0, 0, 0, 0.88);
  --label-fg: #fff;
}
:root[data-theme='light'] {
  --bg: #fff;
  --panel: #f2f2f2;
  --fg: #000;
  --dim: #222;
  --line: #6b6b6b;
  --accent: #0040e0;
  --accent-ink: #fff;
  --focus: #0040e0;
  --btn: #fff;
  --btn-on: #0040e0;
  --btn-on-ink: #fff;
  --label-bg: rgba(255, 255, 255, 0.94);
  --label-fg: #000;
}
:root[data-theme='soft'] {
  --bg: #e4e6e9;
  --panel: #f4f5f6;
  --fg: #111;
  --dim: #333;
  --line: #8a8f96;
  --accent: #0a58ca;
  --accent-ink: #fff;
  --focus: #b8002e;
  --btn: #fff;
  --btn-on: #0a58ca;
  --btn-on-ink: #fff;
  --label-bg: rgba(255, 255, 255, 0.92);
  --label-fg: #111;
}
html, body { background: var(--bg); }
#app {
  position: fixed; inset: 0;
  display: grid;
  grid-template-rows: auto minmax(55vh, 1fr) auto;
  overflow-y: auto;
  font-family: Verdana, 'Atkinson Hyperlegible', system-ui, sans-serif;
  font-size: var(--fs);
  line-height: 1.4;
  color: var(--fg);
  background: var(--bg);
  font-variant-ligatures: normal;
}
#app * { box-sizing: border-box; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 0; z-index: 99; background: var(--accent); color: var(--accent-ink); padding: .5em 1em; }
.skip:focus { left: 1em; }
kbd { font-family: inherit; font-size: .72em; border: 1px solid currentColor; border-radius: 4px; padding: 0 .3em; opacity: .85; }
h1 { font-size: 1.45em; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.05em; margin: 0 0 .4em; }
h3 { font-size: .9em; margin: .8em 0 .3em; color: var(--dim); }
p { margin: .3em 0; }

/* every interactive thing: big target, thick focus ring */
button, select, input[type='search'], .chk, input[type='range'] { font: inherit; color: var(--fg); }
button, select {
  min-height: 2.2em; padding: .25em .7em; border: 2px solid var(--line); border-radius: 8px;
  background: var(--btn); cursor: pointer;
}
button:hover, select:hover { border-color: var(--fg); }
button[aria-checked='true'], button[aria-pressed='true'], button.on {
  background: var(--btn-on); color: var(--btn-on-ink); border-color: var(--btn-on); font-weight: 700;
}
:focus-visible, #gl:focus { outline: 4px solid var(--focus) !important; outline-offset: 3px; }
input[type='search'] { width: 100%; min-height: 2.2em; padding: .25em .6em; border: 2px solid var(--line); border-radius: 8px; background: var(--btn); }
input[type='range'] { width: 10em; accent-color: var(--accent); }
input[type='checkbox'] { width: 1.2em; height: 1.2em; accent-color: var(--accent); vertical-align: middle; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: .6em 1.2em; padding: .5em 1em; border-bottom: 2px solid var(--line); background: var(--panel); }
.titles { flex: 1 1 24em; }
.subtitle { color: var(--dim); font-size: .9em; }
.ident { color: var(--dim); font-size: .72em; }
.topbtns { display: flex; flex-wrap: wrap; gap: .4em; }
.views { padding: .3em 0 .8em; border-bottom: 1px solid var(--line); }
.views .lbl { display: block; font-size: 1.05em; margin-bottom: .35em; }
.views .lbl { font-weight: 700; }
.viewbtns { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5em, 1fr)); gap: .35em; }
.viewbtns button { text-align: left; }
.viewbtns .vnum { display: inline-block; min-width: 1.3em; font-weight: 700; opacity: .8; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(18em, 32%); min-height: 0; }
.stagewrap { position: relative; min-height: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.leaders .ldr { stroke: var(--label-fg); stroke-width: calc(2px * var(--lscale)); opacity: .9; }
.leaders .ldr.sel { stroke: var(--accent); stroke-width: calc(3px * var(--lscale)); }
.leaders .dot { fill: var(--label-fg); stroke: var(--label-bg); stroke-width: 2px; }
.leaders .dot.sel { fill: var(--accent); }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lab3d {
  position: absolute; padding: .15em .5em; border: 2px solid var(--label-fg); border-radius: 6px;
  background: var(--label-bg); color: var(--label-fg); font-weight: 700; white-space: normal; line-height: 1.2;
}
.lab3d.sel { border: 3px solid var(--accent); box-shadow: 0 0 0 2px var(--label-bg); }
.viewdesc { position: absolute; left: .6em; top: .4em; right: .6em; margin: 0; padding: .25em .6em; max-width: 40em; font-size: .85em;
  background: var(--label-bg); color: var(--label-fg); border-radius: 6px; border: 1px solid var(--line); pointer-events: none; }
.legend { position: absolute; left: .6em; bottom: .6em; display: flex; flex-wrap: wrap; gap: .3em .9em; align-items: center; padding: .3em .6em;
  background: var(--label-bg); color: var(--label-fg); border-radius: 6px; font-size: .8em; }
.legend:empty { display: none; }
.legend p { margin: 0; font-weight: 700; width: 100%; }

.sidebar { overflow-y: auto; border-left: 2px solid var(--line); background: var(--panel); padding: .6em .9em 2em; }
.panel { padding: .5em 0 .8em; border-bottom: 1px solid var(--line); }
.panel select { width: 100%; }
.lab { display: block; margin-bottom: .25em; }
.hint { color: var(--dim); }
.partslist ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .3em; }
.partslist .part { width: 100%; text-align: left; }
.sysh { margin-top: .9em; }
.approx { font-weight: 700; }
.details .pname { font-size: 1.3em; font-weight: 700; margin: .1em 0; }
.tag { display: inline-block; padding: .05em .45em; border: 2px solid var(--line); border-radius: 6px; font-size: .8em; margin: .1em .2em .1em 0; }
.approxtag { border-style: dashed; }
.facts dt { font-weight: 700; margin-top: .55em; color: var(--accent); }
:root[data-theme='dark'] .facts dt { color: var(--accent); }
.facts dd { margin: .1em 0 0; }
.oem { font-size: .82em; margin-top: .8em; }
.oem a { color: var(--fg); text-decoration-thickness: 2px; }
.pn { color: var(--dim); }
.detbtns { display: flex; flex-wrap: wrap; gap: .4em; margin-top: .7em; }

.transport { display: flex; flex-wrap: wrap; gap: .5em 1.4em; align-items: center; padding: .5em 1em; border-top: 2px solid var(--line); background: var(--panel); }
.transport .grp { display: flex; flex-wrap: wrap; align-items: center; gap: .4em; }
.transport .big { min-width: 7em; font-weight: 700; }
.state .crank { font-size: .95em; }
.state .k { color: var(--dim); }
.cyls { display: flex; flex-wrap: wrap; gap: .2em .9em; list-style: none; margin: 0; padding: 0; font-size: .85em; }
.cyls li { padding: 0 .3em; border-radius: 4px; }
.cyls li.fire { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.vtec { font-weight: 400; }
.vtecstate { font-size: .8em; color: var(--dim); max-width: 16em; }
.flows { border: 2px solid var(--line); border-radius: 8px; padding: .1em .6em .3em; margin: 0; }
.flows legend { font-size: .8em; padding: 0 .3em; }
.chk { display: inline-flex; align-items: center; gap: .35em; margin-right: .6em; cursor: pointer; }
.sw { display: inline-block; width: 1em; height: 1em; background: var(--c); flex: none; }
.sw-cone { clip-path: polygon(0 100%, 50% 0, 100% 100%); }
.sw-double { clip-path: polygon(0 50%, 40% 0, 40% 40%, 100% 40%, 100% 60%, 40% 60%, 40% 100%); }
.sw-drop { border-radius: 50%; }
.sw-cube { border-radius: 2px; transform: scale(.85); }

.dialog { position: fixed; z-index: 50; right: 1em; top: 4.5em; width: min(30em, calc(100vw - 2em)); max-height: calc(100vh - 6em); overflow-y: auto;
  background: var(--panel); color: var(--fg); border: 3px solid var(--fg); border-radius: 10px; padding: .8em 1em; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.dialog.wide { width: min(46em, calc(100vw - 2em)); }
.dialog .drow { display: flex; flex-wrap: wrap; align-items: center; gap: .5em; margin: .6em 0; }
.dialog dl { display: grid; grid-template-columns: auto 1fr; gap: .4em .8em; }
.dialog dd { margin: 0; }
.dialog ul { padding-left: 1.2em; }
.dialog li { margin: .25em 0; }
.closebtn { margin-top: .6em; }

@media (max-width: 900px) {
  #app { position: static; display: block; overflow: auto; height: auto; }
  html, body { overflow: auto !important; height: auto; }
  .main { display: block; }
  .stagewrap { height: 62vh; }
  .sidebar { border-left: 0; border-top: 2px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.",connects:"Screws into the valve cover. Oil poured here runs down through the head to the oil pan.",moves:"Does not move while running."},timingCoverUpper:{name:"Upper timing-belt cover",where:"The black ribbed plastic cover at the top of the timing-belt end.",does:"Protects the camshaft pulley and the top of the timing belt.",connects:"Bolts to the head and to the lower cover.",moves:"Does not move."},timingCoverLower:{name:"Lower timing-belt cover",where:"The larger black cover at the timing-belt end, behind the crankshaft pulley.",does:"Protects the lower part of the timing belt, the balancer belt and their pulleys.",connects:"Bolts to the block; the crankshaft passes through it to the outer pulley.",moves:"Does not move."},engineMount:{name:"Engine mounting bracket",where:"The rusty steel bracket with a tall stud, on the timing-belt end near the top.",does:"Holds this end of the engine to the car\u2019s body through a rubber mount.",connects:"Bolts to the engine; the stud goes to the mount in the car.",moves:"Does not move."},oilPan:{name:"Oil pan",where:"The black painted pan underneath the engine.",does:"Holds the engine oil when it is not being pumped around.",connects:"Bolts under the block. The oil pickup sits inside it; the drain bolt is at the bottom.",moves:"Does not move. Oil drains back into it from above."},block:{name:"Cylinder block",where:"The large grey aluminium middle of the engine.",does:"Holds the four cylinders, where the pistons move, and carries the crankshaft below them.",connects:"The head bolts on top, the oil pan below, the timing parts at one end and the transmission at the other.",moves:"Does not move."},bearingBridge:{name:"Bearing-cap bridge",where:"Inside the bottom of the block, holding the crankshaft from below.",does:"Ties the crankshaft\u2019s five main bearing caps together to stiffen the bottom of the engine.",connects:"Bolts to the bottom of the block around the crankshaft.",moves:"Does not move."},crankshaft:{name:"Cranks ocker",where:"The centre rocker of the three intake rockers in each cylinder.",does:"Follows the largest cam lobe. With VTEC off it moves alone and opens nothing.",connects:"Rides the middle lobe; pushed up by the lost-motion assembly; locks the other two when VTEC is on.",moves:"Always rocks with the middle lobe."},secondaryRocker:{name:"Secondary intake rocker",where:"The intake rocker over the second intake valve of each cylinder.",does:"At low speed opens its valve only slightly. This swirls the air and stops fuel collecting.",connects:"Rides the small secondary lobe; presses the second intake valve; locks to the middle rocker when VTEC is on.",moves:"Barely moves with VTEC off; follows the middle rocker when VTEC is on."},syncPistons:{name:"VTEC locking pistons",where:"Small pistons inside the three intake rockers of each cylinder.",does:"When oil pressure pushes them across, they lock the three rockers into one. Both valves then follow the big middle lobe.",connects:"Fed with oil through the intake rocker shaft. A return spring pushes them back.",moves:"Slide sideways when VTEC switches, only while the valves are closed."},lostMotion:{name:"Lost-motion assembly",where:"A spring plunger in the head under each middle rocker.",does:"Keeps the middle rocker against its lobe while it is not opening any valve.",connects:"Pushes up on the middle rocker.",moves:"Compresses and extends as the middle rocker rocks."},timingPlate:{name:"VTEC timing plate",where:"A small plate beside each intake rocker set.",does:"Makes sure the locking pistons only move when the valves are closed, so the switch is clean.",connects:"Sits on the intake rocker shaft; a spring returns it.",moves:"Turns slightly while VTEC switches."},vtecSolenoid:{name:"VTEC solenoid and spool valve",where:"On the intake side of the head, at the transmission end.",does:"The engine computer switches it to let pressurised oil reach the locking pistons.",connects:"Fed from the engine\u2019s oil; sends oil to the
